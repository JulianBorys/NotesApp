{% extends "base.html" %}
{% load static %}

{% block title %}Logowanie{% endblock %}

{% block content %}
<div class="form-container">
  <h1>Zaloguj się</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Zaloguj się">
  </form>
  <div class="extra-links">
    <p><a href="{% url 'register' %}">Zarejestruj się</a></p>
    <p><a href="{% url "password_reset" %}">
        Nie pamiętasz hasła?
    </a></p>
  </div>
</div>
{% endblock %}
