{% extends "base.html" %}

{% block title %} Welcome {% endblock %}

{% block content %}
<div class="welcome-container">
    <h1 class="welcome-title">Witaj {{ new_user.first_name }}!</h1>
    <p class="welcome-message">
        Twoje konto zostało pomyślnie utworzone. Teraz możesz 
        <a href="{% url 'login' %}" class="welcome-link">zalogować się</a>.
    </p>
</div>
{% endblock %}
