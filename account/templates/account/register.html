{% extends "base.html" %}
{% load static %}

{% block title %}Rejestracja{% endblock %}

{% block content %}
<div class="form-container">
  <h1>Zarejestruj się</h1>
  <form method="post">
    {% csrf_token %}
    {{ user_form.as_p }}
    <input type="submit" value="Zarejestruj się">
  </form>
  <div class="extra-links">
    <p><a href="{% url 'login' %}">Masz już konto? Zaloguj się</a></p>
  </div>
</div>
{% endblock %}
