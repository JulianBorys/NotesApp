{% extends "base.html" %}

{% block title %} Reset your password {% endblock %}

{% block content %}
<div class="form-container">
    <h1 class="form-title">Zapomniałeś hasła?</h1>
    <p class="form-description">Wprowadź swój adres e-mail, aby otrzymać nowe hasło.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-fields">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn-submit">Wyślij e-mail</button>
    </form>
</div>
{% endblock %}
