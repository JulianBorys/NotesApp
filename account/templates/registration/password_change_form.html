{% extends "base.html" %}

{% block title %} Zmień swoje hasło {% endblock %}

{% block content %}
<div class="form-container">
    <h1>Zmień swoje hasło</h1>
    <p>Użyj poniższego formularza, aby zmienić swoje hasło.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Zmień hasło" class="btn-submit">
    </form>
</div>
{% endblock %}
