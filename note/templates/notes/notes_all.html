{% extends "base.html" %}

{% block title %} Notes {% endblock %}

{% block content %}

    {% for note in notes %}
        <h2>
            <a href="{{ note.get_absolute_url }}">
                {{ note.title }}
            </a>
        </h2>
        <h3>
            <a href="{{ note.course.get_absolute_url }}">
                {{ note.course}}
            </a>
        </h3>
        <h4>
            <a href="{{ note.course.university.get_absolute_url }}">
            {{ note.course.university}}
            </a>
        </h4>
        <div>
            {{ note.body}}
        </div>
    {% endfor %}

{% endblock %}
