{% extends "base.html" %}

{% block content %}
    <h2>Potwierdź usunięcie</h2>
    <p>Na pewno chcesz usunąć tę notatkę?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Usuń</button>
        <a href="{% url 'notes:note_list' %}" class="btn btn-secondary">Anuluj</a>
    </form>
{% endblock %}
