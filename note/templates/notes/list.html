{% extends "base.html" %}

{% block title %}Notes{% endblock %}

{% block content %}
    <h1>Notes</h1>
    {% for note in notes %}
        <h2>
            <a href="{% url 'note:note_detail' note.id %}">
                {{ note.title }}
            </a>
        </h2>
        <p class="date">
            Published {{ note.publish }} by {{ note.author }}
        </p>
        {{ note.body|truncatewords:30|linebreaks }}
    {% endfor %}
{% endblock %}
