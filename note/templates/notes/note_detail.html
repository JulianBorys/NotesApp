{% extends "base.html" %}

{% block title %} {{ note.title }} {% endblock %}

{% block content %}

    <h1>{{ note.title }}</h1>
    <p>
        Created {{ note.created }} by 
        <a href="{% url 'notes:note_user_list' pk=note.author.id %}">
            {{ note.author }}
        </a>
    </p>
    {{ note.body|linebreaks }}

    <a href="{% url 'notes:update_note' note.pk %}">Edytuj</a>
    <a href="{% url 'notes:delete_note' note.pk %}" class="btn btn-danger">Usuń</a>

{% endblock %}
